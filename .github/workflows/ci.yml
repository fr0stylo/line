name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module:
          - core
          - broker
          - client
          - contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}

  build:
    name: verify (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module:
          - core
          - broker
          - client
          - contracts
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          check-latest: true

      - name: Go version
        run: go version

      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "Run gofmt on:"
            echo "$fmt_out"
            exit 1
          fi
        working-directory: ${{ matrix.module }}

      - name: go vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}

      - name: go test
        run: go test ./...
        working-directory: ${{ matrix.module }}

      - name: go build
        run: go build ./...
        working-directory: ${{ matrix.module }}
